name: Crypto Drop Hunter - Every 20 Mins

# Runs 3 times an hour, all day
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'  # Every 20 minutes

permissions:
  contents: write

jobs:
  hunt-drops:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 web3
      
      - name: Run drop hunter
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          WALLET_PRIVATE_KEY: ${{ secrets.WALLET_PRIVATE_KEY }}
        run: python crypto_drop_hunter.py
      
      - name: Commit and push checked drops database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add checked_drops.json daily_stats.json
          git diff --cached --quiet || (git commit -m "chore: update checked drops database [skip ci]" && git push)
      
      - name: Upload email draft
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: email-draft-${{ github.run_id }}
          path: email_draft.html
          retention-days: 7

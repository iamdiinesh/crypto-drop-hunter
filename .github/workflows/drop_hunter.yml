name: Crypto Drop Hunter - 3x Daily

# Runs at 8am, 3pm, and 12am UTC
on:
  schedule:
    - cron: '0 8 * * *'     # 8am UTC
    - cron: '0 15 * * *'    # 3pm UTC
    - cron: '0 0 * * *'     # 12am UTC

jobs:
  hunt-drops:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      
      - name: Run drop hunter
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: python crypto_drop_hunter.py
      
      - name: Upload email draft
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: email-draft-${{ github.run_id }}
          path: email_draft.html
          retention-days: 7
